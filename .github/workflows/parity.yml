name: Parity

# Compares the TypeScript engine against the real starship binary. Runs on
# every PR touching the engine, on main, and weekly against whatever starship
# has released since — upstream drift is the failure mode this exists to catch,
# and it does not announce itself.
#
# Two versions, deliberately: pull requests compare against a pinned release so
# an upstream release cannot fail a PR that never touched the engine, while the
# weekly run takes the newest one so that drift shows up on its own schedule
# rather than in someone else's review.
on:
  pull_request:
    paths:
      - "src/lib/engine/**"
      - "src/lib/config/**"
      - "tests/parity/**"
      - ".github/workflows/parity.yml"
  push:
    branches: [main]
  schedule:
    # 04:20 UTC Mondays (~14:20 AEST), well clear of the weekday deploy window.
    - cron: "20 4 * * 1"
  workflow_dispatch:

concurrency:
  group: parity-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  parity:
    # GitHub-hosted, always — see ci.yml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install verified starship release
        env:
          # Pull requests and pushes compare against a pinned release, so a
          # starship release cannot redden a PR that has nothing to do with
          # it. Scheduled and manually dispatched runs deliberately track the
          # newest release instead.
          PINNED_TAG: "v1.25.1"
        run: |
          set -euo pipefail
          archive="starship-x86_64-unknown-linux-musl.tar.gz"
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tracking the latest starship release"
            release_base="https://github.com/starship/starship/releases/latest/download"
          else
            echo "pinned to starship $PINNED_TAG"
            release_base="https://github.com/starship/starship/releases/download/$PINNED_TAG"
          fi

          download_dir="$RUNNER_TEMP/starship-download"
          bin_dir="$RUNNER_TEMP/starship-bin"
          mkdir -p "$download_dir" "$bin_dir"
          cd "$download_dir"
          curl --proto "=https" --tlsv1.2 -fsSLO "$release_base/$archive"
          curl --proto "=https" --tlsv1.2 -fsSLO "$release_base/$archive.sha256"
          expected_checksum="$(tr -d '[:space:]' < "$archive.sha256")"
          actual_checksum="$(sha256sum "$archive" | cut -d " " -f 1)"
          test "$actual_checksum" = "$expected_checksum"
          tar -xzf "$archive"
          install -m 0755 starship "$bin_dir/starship"
          echo "$bin_dir" >> "$GITHUB_PATH"
          "$bin_dir/starship" --version

      - name: Configure git for fixtures
        run: |
          git config --global user.email tester@example.com
          git config --global user.name Tester
          git config --global init.defaultBranch main
          git config --global --add safe.directory '*'

      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run parity suite
        env:
          CI: "true"
        run: pnpm test:parity
