name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # GitHub-hosted, always. This repository is public: a pull request from a
    # fork is attacker-authored code, and it must never run on a self-hosted
    # runner sitting on a home LAN. See docs/ci-runners.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build
