name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # GitHub-hosted, always. This repository is public: a pull request from a
    # fork is attacker-authored code, and it must never run on a self-hosted
    # runner sitting on a home LAN. See docs/ci-runners.md.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm deadcode

      - name: Install browser engines
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - run: pnpm typecheck

      - run: pnpm test

      # Playwright builds and serves the production static export itself. This
      # covers the build as well as the desktop, mobile and axe suites.
      - run: pnpm test:e2e

  cli-platforms:
    name: CLI · Node ${{ matrix.node }} · ${{ matrix.os }}
    # All matrix values below are GitHub-hosted. Public pull requests must not
    # execute attacker-authored code on the self-hosted cluster.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck:cli

      # Pack and install into an empty consumer project, then invoke the
      # installed binary. This catches missing runtime dependencies and broken
      # bin metadata that a workspace invocation can mask.
      - run: pnpm test:cli:package

      - name: Interactive PTY or Windows ConPTY smoke
        run: pnpm test:cli:pty

      - run: pnpm test:cli

      - run: pnpm build:cli

      - run: node packages/cli/dist/index.js preview --preset plain-text-symbols --scenario simple --no-color
