"$schema" = "https://starship.rs/config-schema.json"

add_newline = false
format = "$directory$git_branch$git_status[](fg:p10k_surface) $character"
right_format = "([](fg:p10k_surface)$status$cmd_duration$jobs)"
palette = "powerlevel10k"

[directory]
format = "[ $path ]($style)[](fg:p10k_separator bg:p10k_surface)"
style = "bg:p10k_surface fg:p10k_directory"
truncate_to_repo = false
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[ $branch]($style)"
style = "bg:p10k_surface fg:p10k_green"
symbol = ""

[git_status]
format = "[$all_status$ahead_behind]($style)"
style = "bg:p10k_surface fg:p10k_modified"

[status]
disabled = false
format = "[ $symbol$status ](bold fg:p10k_red bg:p10k_surface)"
symbol = "✘"
style = "bold fg:p10k_red bg:p10k_surface"

[cmd_duration]
format = "[ $duration ](fg:p10k_duration bg:p10k_surface)"
min_time = 3000

[jobs]
format = "[ $symbol$number ](bold fg:p10k_directory bg:p10k_surface)"
symbol = "✦"
style = "bold fg:p10k_directory bg:p10k_surface"

[character]
success_symbol = "[❯](bold fg:p10k_green)"
error_symbol = "[❯](bold fg:p10k_red)"
vimcmd_symbol = "[❮](bold fg:p10k_green)"

[palettes.powerlevel10k]
p10k_directory = "#00afff"
p10k_green = "#5fd700"
p10k_red = "#ff0000"
p10k_modified = "#d7af00"
p10k_duration = "#a8a8a8"
p10k_time = "#5f8787"
p10k_surface = "#444444"
p10k_separator = "#949494"
p10k_foreground = "#e4e4e4"
p10k_outline = "#6c6c6c"
p10k_black = "#080808"
p10k_blue = "#005faf"
p10k_yellow = "#d7af00"
p10k_white = "#d0d0d0"
