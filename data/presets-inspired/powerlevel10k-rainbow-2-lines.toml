"$schema" = "https://starship.rs/config-schema.json"

add_newline = false
format = "[╭─](fg:p10k_outline)[](fg:white)$os$directory$git_branch$git_status[](fg:green)$fill([](fg:yellow)$status$cmd_duration$jobs$time[](fg:white))[─╮](fg:p10k_outline)$line_break[╰─](fg:p10k_outline)$character"
right_format = "[─╯](fg:p10k_outline)"
palette = "powerlevel10k"

[os]
disabled = false
format = "[ $symbol]($style)[](fg:white bg:blue)"
style = "fg:black bg:white"

[os.symbols]
Linux = " "
Macos = " "
Ubuntu = " "
Windows = " "

[directory]
format = "[   $path ]($style)[](fg:blue bg:green)"
style = "bold fg:white bg:blue"
truncate_to_repo = false
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[ on ](fg:black bg:green)[$symbol $branch]($style)"
style = "fg:black bg:green"
symbol = ""

[git_status]
format = "[$all_status$ahead_behind]($style)"
style = "fg:p10k_modified bg:green"

[status]
disabled = false
format = "[ $symbol$status ](bold fg:p10k_red bg:yellow)"
symbol = "✘"
style = "bold fg:p10k_red bg:yellow"

[fill]
style = "fg:p10k_outline"
symbol = "─"

[cmd_duration]
format = "[ took  $duration ](fg:black bg:yellow)"
min_time = 3000

[jobs]
format = "[ $symbol$number ](bold fg:blue bg:yellow)"
symbol = "✦"
style = "bold fg:blue bg:yellow"

[time]
disabled = false
format = "[](fg:white bg:yellow)[ at  $time ](fg:black bg:white)"
time_format = "%H:%M:%S"

[character]
success_symbol = "[❯](bold fg:p10k_green)"
error_symbol = "[❯](bold fg:p10k_red)"
vimcmd_symbol = "[❮](bold fg:p10k_green)"

[palettes.powerlevel10k]
p10k_directory = "#00afff"
p10k_green = "#5fd700"
p10k_red = "#ff0000"
p10k_modified = "#d7af00"
p10k_duration = "#87875f"
p10k_time = "#5f8787"
p10k_surface = "#444444"
p10k_separator = "#949494"
p10k_foreground = "#e4e4e4"
p10k_outline = "#6c6c6c"
p10k_black = "#080808"
p10k_blue = "#005faf"
p10k_yellow = "#d7af00"
p10k_white = "#d0d0d0"
